name: Validate website launcher

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_remote_smoke:
        description: Run the clean public main-branch clone smoke check
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check static launcher instructions
        run: |
          node tests/website-launcher.mjs
      - name: Check public main-branch clone with a clean checkout
        if: github.event_name == 'workflow_dispatch' && inputs.run_remote_smoke
        run: node tests/website-launcher.mjs --remote-smoke

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build website without publishing
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check rendered launcher route and homepage link
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
                  self.text = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      self.hrefs.append(dict(attrs).get("href"))
              def handle_data(self, data):
                  self.text.append(data)

          root = Path("_site")
          home = Links()
          home.feed((root / "index.html").read_text())
          assert "/use-sslz-agent/" in home.hrefs
          launcher = (root / "use-sslz-agent/index.html").read_text()
          links = Links()
          links.feed(launcher)
          text = " ".join(" ".join(links.text).split())
          assert "Run SSLZ Agent" in text
          assert "git clone --branch main --single-branch" in text
          assert "copilot --agent sslz-agent" in text
          assert "git status --short --branch" in text
          assert "50a3ce1423e432ccdd9fa470452f6cfce75e2a50" not in text
          assert "{{" not in launcher
          assert "/#quick-start" in links.hrefs
          print("Rendered homepage CTA, launcher route, main-branch commands, and Quick Start link passed.")
          PY
