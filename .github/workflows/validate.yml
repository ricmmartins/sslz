name: Validate IaC

on:
  pull_request:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/**'
      - 'infra/**'
      - 'examples/**'
      - 'scripts/validate-agent-contracts.mjs'
      - 'scripts/validate-greenfield-journey.mjs'
      - 'scripts/startup-preflight.*'
      - 'scripts/subscription-topology.mjs'
      - 'scripts/defender-workspace-placement.mjs'
      - 'scripts/startup-workload-plan.*'
      - 'scripts/aks-ingress-contract.mjs'
      - 'scripts/startup-regional-plan.*'
      - 'scripts/startup-postgresql-plan.*'
      - 'scripts/startup-postgresql-migration-plan.*'
      - 'scripts/startup-postgresql-rehearsal-plan.*'
      - 'scripts/startup-postgresql-execution-plan.*'
      - 'scripts/startup-container-image-cicd-plan.*'
      - 'scripts/startup-iac-plan.*'
      - 'scripts/startup-cool-foundation-plan.*'
      - 'scripts/startup-container-apps-cool-plan.*'
      - 'scripts/startup-provider-remediation.*'
      - 'scripts/startup-deployment-integration.*'
      - 'scripts/azure-cli-invocation.mjs'
      - 'scripts/terraform-plan-provenance.mjs'
      - 'scripts/regional-attempt.mjs'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/**'
      - 'infra/**'
      - 'examples/**'
      - 'scripts/validate-agent-contracts.mjs'
      - 'scripts/validate-greenfield-journey.mjs'
      - 'scripts/startup-preflight.*'
      - 'scripts/subscription-topology.mjs'
      - 'scripts/defender-workspace-placement.mjs'
      - 'scripts/startup-workload-plan.*'
      - 'scripts/aks-ingress-contract.mjs'
      - 'scripts/startup-regional-plan.*'
      - 'scripts/startup-postgresql-plan.*'
      - 'scripts/startup-postgresql-migration-plan.*'
      - 'scripts/startup-postgresql-rehearsal-plan.*'
      - 'scripts/startup-postgresql-execution-plan.*'
      - 'scripts/startup-container-image-cicd-plan.*'
      - 'scripts/startup-iac-plan.*'
      - 'scripts/startup-cool-foundation-plan.*'
      - 'scripts/startup-container-apps-cool-plan.*'
      - 'scripts/startup-provider-remediation.*'
      - 'scripts/startup-deployment-integration.*'
      - 'scripts/azure-cli-invocation.mjs'
      - 'scripts/terraform-plan-provenance.mjs'
      - 'scripts/regional-attempt.mjs'
      - 'tests/**'

permissions:
  contents: read

jobs:
  validate-agent-contracts:
    name: Validate Agent Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate schemas, catalog, and examples
        run: node scripts/validate-agent-contracts.mjs

      - name: Test blocking-check catalog coverage
        run: node tests/blocking-check-catalog.mjs

      - name: Test deployment workflow gates
        run: node tests/deployment-workflow-gates.mjs

      - name: Test read-only startup preflight
        run: node tests/startup-preflight.mjs

      - name: Test read-only workload planner
        run: node tests/startup-workload-plan.mjs

      - name: Test AKS ingress decision and postcheck contracts
        run: node tests/aks-ingress-contract.mjs

      - name: Test read-only regional planner
        run: node tests/startup-regional-plan.mjs

      - name: Test deterministic PostgreSQL regional fallback
        run: node tests/startup-postgresql-plan.mjs

      - name: Test read-only PostgreSQL migration planning
        run: node tests/startup-postgresql-migration-plan.mjs

      - name: Test read-only PostgreSQL rehearsal planning
        run: node tests/startup-postgresql-rehearsal-plan.mjs

      - name: Test approval-bound PostgreSQL execution planning
        run: node tests/startup-postgresql-execution-plan.mjs

      - name: Test read-only container image and CI/CD planning
        run: node tests/startup-container-image-cicd-plan.mjs

      - name: Test Defender workspace placement
        run: node tests/defender-workspace-placement.mjs

      - name: Test local IaC plan generation
        run: node tests/startup-iac-plan.mjs

      - name: Test readiness evidence binding
        run: node tests/startup-readiness-evidence.mjs

      - name: Test cool foundation planning
        run: node tests/startup-cool-foundation-plan.mjs

      - name: Test Container Apps cool profile planning
        run: node tests/startup-container-apps-cool-plan.mjs

      - name: Test approved provider remediation
        run: node tests/startup-provider-remediation.mjs

      - name: Test approved deployment integration
        run: node tests/startup-deployment-integration.mjs

      - name: Test regional deployment attempts
        run: node tests/regional-attempt.mjs

      - name: Install Bicep CLI for synthetic deployment preparation
        run: az bicep install

      - name: Validate synthetic agent-aware founder journey
        run: node scripts/validate-greenfield-journey.mjs

  validate-bicep:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install

      - name: Build all Bicep files
        run: |
          echo "=== Validating Bicep modules ==="
          failed=0
          for file in $(find infra/bicep examples -name '*.bicep' -not -name '*.bicepparam'); do
            echo "Building: $file"
            if az bicep build --file "$file" --stdout > /dev/null 2>&1; then
              echo "  ✓ OK"
            else
              echo "  ✗ FAILED"
              az bicep build --file "$file" 2>&1 || true
              failed=1
            fi
          done
          if [ $failed -eq 1 ]; then
            echo "::error::One or more Bicep files failed validation"
            exit 1
          fi

      - name: Lint Bicep files (strict)
        run: |
          echo "=== Linting Bicep modules ==="
          failed=0
          for file in $(find infra/bicep examples -name '*.bicep' -not -name '*.bicepparam'); do
            echo "Linting: $file"
            if ! az bicep lint --file "$file" 2>&1; then
              failed=1
            fi
          done
          if [ $failed -eq 1 ]; then
            echo "::error::One or more Bicep files have lint warnings or errors"
            exit 1
          fi

      - name: Test compiled cool foundation CIDR guards
        run: az bicep build --file infra/bicep/cool-foundation.bicep --stdout | node tests/cool-foundation-bicep-template.mjs

      - name: Test compiled primary networking profile isolation
        run: az bicep build --file infra/bicep/main.bicep --stdout | node tests/primary-bicep-networking-template.mjs

      - name: Test compiled Defender workspace placement
        run: node tests/defender-workspace-bicep-template.mjs

      - name: Test compiled Container Apps cool profile guards
        run: az bicep build --file infra/bicep/cool-container-apps.bicep --stdout | node tests/cool-container-apps-bicep-template.mjs

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Init TFLint
        run: tflint --init --config=.tflint.hcl

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

      - name: TFLint — Landing Zone
        working-directory: infra/terraform
        run: tflint --config="${{ github.workspace }}/.tflint.hcl"

      - name: TFLint — Cool Foundation
        working-directory: infra/terraform/cool-foundation
        run: tflint --config="${{ github.workspace }}/.tflint.hcl"

      - name: TFLint — Shared Networking Module
        working-directory: infra/terraform/modules/networking
        run: tflint --config="${{ github.workspace }}/.tflint.hcl"

      - name: TFLint — Container Apps Cool Profile
        working-directory: infra/terraform/cool-container-apps
        run: tflint --config="${{ github.workspace }}/.tflint.hcl"

      - name: TFLint — Examples
        run: |
          for dir in examples/*/terraform; do
            if [ -d "$dir" ]; then
              echo "=== Linting $dir ==="
              tflint --config="${{ github.workspace }}/.tflint.hcl" --chdir="$dir" --minimum-failure-severity=error
            fi
          done

      - name: Terraform Init — Landing Zone
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform Validate — Landing Zone
        working-directory: infra/terraform
        run: |
          terraform validate
          terraform test

      - name: Terraform Init & Validate — Cool Foundation
        working-directory: infra/terraform/cool-foundation
        run: |
          terraform init -backend=false
          terraform validate
          terraform test

      - name: Terraform Test — Networking Profile Isolation
        working-directory: infra/terraform/modules/networking
        run: |
          terraform init -backend=false
          terraform validate
          terraform test

      - name: Terraform Init & Validate — Container Apps Cool Profile
        working-directory: infra/terraform/cool-container-apps
        run: |
          terraform init -backend=false
          terraform validate
          terraform test

      - name: Terraform Init & Validate — Examples
        run: |
          failed=0
          for dir in examples/*/terraform; do
            if [ -d "$dir" ]; then
              echo "=== Validating $dir ==="
              terraform -chdir="$dir" init -backend=false
              if terraform -chdir="$dir" validate; then
                echo "  ✓ OK"
              else
                echo "  ✗ FAILED"
                failed=1
              fi
            fi
          done
          if [ $failed -eq 1 ]; then
            echo "::error::One or more example Terraform configs failed validation"
            exit 1
          fi
