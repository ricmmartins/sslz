name: Validate IaC

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - 'examples/**'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'examples/**'

jobs:
  validate-bicep:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install

      - name: Build all Bicep files
        run: |
          echo "=== Validating Bicep modules ==="
          failed=0
          for file in $(find infra/bicep examples -name '*.bicep' -not -name '*.bicepparam'); do
            echo "Building: $file"
            if az bicep build --file "$file" --stdout > /dev/null 2>&1; then
              echo "  ✓ OK"
            else
              echo "  ✗ FAILED"
              az bicep build --file "$file" 2>&1 || true
              failed=1
            fi
          done
          if [ $failed -eq 1 ]; then
            echo "::error::One or more Bicep files failed validation"
            exit 1
          fi

      - name: Lint Bicep files
        run: |
          echo "=== Linting Bicep modules ==="
          for file in $(find infra/bicep examples -name '*.bicep' -not -name '*.bicepparam'); do
            echo "Linting: $file"
            az bicep lint --file "$file" 2>&1 || true
          done

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Format Check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra/terraform
        run: terraform validate
