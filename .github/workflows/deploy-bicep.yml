name: Deploy Landing Zone (Bicep)

on:
  push:
    branches: [main]
    paths:
      - 'infra/bicep/**'
  pull_request:
    branches: [main]
    paths:
      - 'infra/bicep/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - prod
          - nonprod

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  BICEP_DIR: infra/bicep

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (prod)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: Validate Bicep (prod)
        run: |
          az deployment sub validate \
            --location ${{ vars.AZURE_LOCATION || 'eastus2' }} \
            --template-file ${{ env.BICEP_DIR }}/main.bicep \
            --parameters ${{ env.BICEP_DIR }}/parameters/prod.bicepparam

      - name: Azure Login (nonprod)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_NONPROD }}

      - name: Validate Bicep (nonprod)
        run: |
          az deployment sub validate \
            --location ${{ vars.AZURE_LOCATION || 'eastus2' }} \
            --template-file ${{ env.BICEP_DIR }}/main.bicep \
            --parameters ${{ env.BICEP_DIR }}/parameters/nonprod.bicepparam

  what-if:
    name: What-If (Preview Changes)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: What-If
        id: whatif
        run: |
          az deployment sub what-if \
            --location ${{ vars.AZURE_LOCATION || 'eastus2' }} \
            --template-file ${{ env.BICEP_DIR }}/main.bicep \
            --parameters ${{ env.BICEP_DIR }}/parameters/prod.bicepparam \
            --no-pretty-print 2>&1 | tee whatif-output.txt

      - name: Post What-If to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const whatif = fs.readFileSync('whatif-output.txt', 'utf8');
            const truncated = whatif.length > 60000 ? whatif.substring(0, 60000) + '\n... (truncated)' : whatif;
            const body = `### Bicep What-If — \`prod\`\n\n<details>\n<summary>Show What-If Output</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  deploy-nonprod:
    name: Deploy Non-Prod
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: nonprod
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_NONPROD }}

      - name: Deploy
        run: |
          az deployment sub create \
            --location ${{ vars.AZURE_LOCATION || 'eastus2' }} \
            --template-file ${{ env.BICEP_DIR }}/main.bicep \
            --parameters ${{ env.BICEP_DIR }}/parameters/nonprod.bicepparam \
            --name "lz-nonprod-$(date +%Y%m%d-%H%M%S)"

  deploy-prod:
    name: Deploy Prod
    runs-on: ubuntu-latest
    needs: deploy-nonprod
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: Deploy
        run: |
          az deployment sub create \
            --location ${{ vars.AZURE_LOCATION || 'eastus2' }} \
            --template-file ${{ env.BICEP_DIR }}/main.bicep \
            --parameters ${{ env.BICEP_DIR }}/parameters/prod.bicepparam \
            --name "lz-prod-$(date +%Y%m%d-%H%M%S)"
