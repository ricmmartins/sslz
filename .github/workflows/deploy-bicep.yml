name: Deploy Landing Zone (Bicep)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment and approved target'
        required: true
        type: choice
        options:
          - nonprod
          - prod
      plan_path:
        description: 'Protected runner path to the approved Phase 4 plan'
        required: true
        type: string
      manifest_path:
        description: 'Protected runner path to the reviewed Phase 6 manifest'
        required: true
        type: string
      approval_path:
        description: 'Protected runner path to the signed Phase 6 approval'
        required: true
        type: string
      regional_attempt_chain:
        description: 'Regional attempt chain bound by the reviewed manifest'
        required: true
        type: string
      regional_attempt_number:
        description: 'Regional attempt number bound by the reviewed manifest'
        required: true
        type: number

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-regional-${{ inputs.environment }}-${{ inputs.regional_attempt_chain }}
  cancel-in-progress: false

jobs:
  apply-approved-baseline:
    name: Apply approved Bicep baseline
    runs-on: [self-hosted, sslz-deployment]
    environment: ${{ inputs.environment }}
    env:
      PLAN_PATH: ${{ inputs.plan_path }}
      MANIFEST_PATH: ${{ inputs.manifest_path }}
      APPROVAL_PATH: ${{ inputs.approval_path }}
      EXPECTED_ENVIRONMENT: ${{ inputs.environment }}
      EXPECTED_PROVIDER: bicep
      EXPECTED_ATTEMPT_CHAIN: ${{ inputs.regional_attempt_chain }}
      EXPECTED_ATTEMPT_NUMBER: ${{ inputs.regional_attempt_number }}
      SSLZ_DEPLOYMENT_APPROVAL_PUBLIC_KEY_FILE: ${{ vars.SSLZ_DEPLOYMENT_APPROVAL_PUBLIC_KEY_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Phase 6 binds the fixed protected replay store beneath this checkout.
          clean: false

      - name: Enforce protected dispatch context
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Approved deployments must be dispatched from main."
            exit 1
          fi
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync(process.env.MANIFEST_PATH, "utf8"));
            if (manifest.execution?.provider !== process.env.EXPECTED_PROVIDER ||
                manifest.execution?.environment !== process.env.EXPECTED_ENVIRONMENT ||
                manifest.regionalAttempt?.chainId !== process.env.EXPECTED_ATTEMPT_CHAIN ||
                manifest.regionalAttempt?.attemptNumber !== Number(process.env.EXPECTED_ATTEMPT_NUMBER)) {
              throw new Error("The reviewed manifest does not match this provider, environment, and regional attempt dispatch.");
            }
          '

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.environment == 'prod' && secrets.AZURE_SUBSCRIPTION_ID_PROD || secrets.AZURE_SUBSCRIPTION_ID_NONPROD }}

      - name: Apply signed Phase 6 approval
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/startup-deployment-integration.sh apply \
            --plan "$PLAN_PATH" \
            --manifest "$MANIFEST_PATH" \
            --approval "$APPROVAL_PATH" \
            --output text
